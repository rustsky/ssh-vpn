# End-to-end tests for ssh-vpn: drives the app's real tunnel/proxy/vpn modules against a local
# test SSH server. Not part of the app build; see e2e/README.md.
[package]
name = "e2e"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: keep it out of the app's (non-)workspace.
[workspace]

[dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
log = "0.4"
tun2proxy = { version = "0.8", default-features = false }
tun = { version = "0.8", features = ["async"] }
tproxy-config = { version = "7", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
